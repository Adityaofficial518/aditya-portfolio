<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
    content="Aditya — Undergraduate in Computer Applications exploring AI automation, software development and practical technology solutions.">

  <title>Aditya | Builder & AI Automation Enthusiast</title>

  <style>
    :root {
      --dark: #101820;
      --dark-soft: #17232d;
      --light: #f5f7f6;
      --white: #ffffff;
      --text: #172027;
      --muted: #65717a;
      --muted-light: #aeb9c0;
      --teal: #19a7a0;
      --teal-dark: #117d79;
      --gold: #c89b3c;
      --border: #dfe5e4;
      --dark-border: rgba(255,255,255,0.12);
      --max: 1120px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: var(--light);
      color: var(--text);
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(90%, var(--max));
      margin: auto;
    }

    /* NAVIGATION */

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(16, 24, 32, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--dark-border);
    }

    nav {
      min-height: 72px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: var(--white);
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo span {
      color: var(--teal);
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 28px;
    }

    .nav-links a {
      color: var(--muted-light);
      font-size: 0.92rem;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--white);
    }

    /* HERO */

    .hero {
      background: var(--dark);
      color: var(--white);
      min-height: calc(100vh - 72px);
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 380px;
      height: 380px;
      border: 1px solid rgba(25,167,160,0.18);
      border-radius: 50%;
      right: -120px;
      bottom: -150px;
    }

    .hero-content {
      max-width: 850px;
      position: relative;
      z-index: 2;
      padding: 100px 0;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #75ddd8;
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .eyebrow::before {
      content: "";
      width: 28px;
      height: 2px;
      background: var(--teal);
    }

    .hero h1 {
      font-size: clamp(3rem, 7vw, 6rem);
      line-height: 0.98;
      letter-spacing: -4px;
      margin-bottom: 28px;
    }

    .hero h1 span {
      color: #68d5cf;
    }

    .hero-subtitle {
      font-size: clamp(1.15rem, 2vw, 1.5rem);
      color: #dce4e7;
      margin-bottom: 22px;
      max-width: 780px;
    }

    .hero-description {
      color: var(--muted-light);
      max-width: 720px;
      font-size: 1.05rem;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 13px;
      margin-top: 34px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border-radius: 7px;
      background: var(--teal);
      color: white;
      font-weight: 700;
      border: 1px solid var(--teal);
      transition: all 0.2s ease;
    }

    .button:hover {
      background: #22bbb3;
      transform: translateY(-2px);
    }

    .button.outline {
      background: transparent;
      border-color: rgba(255,255,255,0.2);
      color: white;
    }

    .button.outline:hover {
      border-color: var(--teal);
    }

    /* GENERAL SECTIONS */

    section {
      padding: 105px 0;
    }

    .section-label {
      color: var(--teal-dark);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: clamp(2rem, 4vw, 3.2rem);
      line-height: 1.15;
      letter-spacing: -1.5px;
      margin-bottom: 22px;
    }

    .section-text {
      max-width: 760px;
      color: var(--muted);
      font-size: 1.03rem;
    }

    /* ABOUT */

    .about {
      background: var(--white);
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 70px;
      align-items: start;
    }

    .about-card {
      background: var(--light);
      padding: 28px;
      border-left: 3px solid var(--teal);
    }

    .about-card strong {
      display: block;
      margin-bottom: 8px;
    }

    .about-card p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* EDUCATION */

    .education {
      background: var(--light);
    }

    .education-card {
      margin-top: 38px;
      padding: 30px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 760px;
    }

    .education-card h3 {
      margin-bottom: 8px;
      font-size: 1.3rem;
    }

    .education-card p {
      color: var(--muted);
    }

    .education-date {
      color: var(--teal-dark) !important;
      font-size: 0.88rem;
      font-weight: 700;
      margin-top: 12px;
    }

    /* SKILLS */

    .skills {
      background: var(--white);
    }

    .skill-group {
      margin-top: 38px;
    }

    .skill-group h3 {
      margin-bottom: 15px;
      font-size: 1.05rem;
    }

    .skill-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .skill {
      padding: 9px 15px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--light);
      font-size: 0.9rem;
      color: #35434b;
    }

    .skill.learning {
      background: #eef9f8;
      border-color: #c6e9e7;
      color: var(--teal-dark);
    }

    /* PROJECTS */

    .projects {
      background: var(--dark);
      color: var(--white);
    }

    .projects .section-label {
      color: #75ddd8;
    }

    .projects .section-text {
      color: var(--muted-light);
    }

    .project-card {
      margin-top: 40px;
      padding: 34px;
      background: var(--dark-soft);
      border: 1px solid var(--dark-border);
      border-radius: 14px;
      max-width: 850px;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(25,167,160,0.12);
      color: #70ddd7
