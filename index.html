<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aditya | AI Automation Enthusiast</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #18252b;
      background: #f4f7f6;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: auto;
    }

    /* NAVIGATION */

    header {
      background: #101a21;
      border-bottom: 1px solid #26343d;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: white;
      font-size: 1.4rem;
      font-weight: bold;
    }

    .logo span {
      color: #25aaa3;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      list-style: none;
    }

    .nav-links a {
      color: #b9c4c9;
      font-size: 0.9rem;
    }

    .nav-links a:hover {
      color: white;
    }

    /* HERO */

    .hero {
      background: #101a21;
      color: white;
      min-height: 90vh;
      display: flex;
      align-items: center;
    }

    .hero-content {
      max-width: 800px;
      padding: 90px 0;
    }

    .tag {
      color: #61d1cb;
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      line-height: 1;
      margin-bottom: 25px;
    }

    .hero h1 span {
      color: #5ed2cc;
    }

    .subtitle {
      font-size: 1.4rem;
      color: #d8e0e3;
      margin-bottom: 20px;
    }

    .description {
      color: #aebbc1;
      max-width: 700px;
      font-size: 1rem;
    }

    .buttons {
      margin-top: 30px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .button {
      display: inline-block;
      padding: 12px 19px;
      border-radius: 7px;
      background: #1da7a0;
      color: white;
      font-weight: bold;
    }

    .button:hover {
      background: #24bdb5;
    }

    .button.secondary {
      background: transparent;
      border: 1px solid #52636c;
    }

    .button.secondary:hover {
      border-color: #1da7a0;
    }

    /* SECTIONS */

    section {
      padding: 90px 0;
    }

    .section-label {
      color: #147d78;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.15;
      margin-bottom: 20px;
    }

    .section-text {
      color: #637179;
      max-width: 750px;
    }

    /* ABOUT */

    .about {
      background: white;
    }

    .about-box {
      margin-top: 35px;
      max-width: 750px;
      padding: 25px;
      background: #f4f7f6;
      border-left: 4px solid #1da7a0;
    }

    .about-box p {
      color: #637179;
    }

    /* EDUCATION */

    .education {
      background: #f4f7f6;
    }

    .education-card {
      margin-top: 35px;
      background: white;
      padding: 28px;
      max-width: 750px;
      border: 1px solid #dce3e2;
      border-radius: 10px;
    }

    .education-card h3 {
      margin-bottom: 8px;
    }

    .education-card p {
      color: #68757c;
    }

    .date {
      color: #147d78 !important;
      font-weight: bold;
      margin-top: 10px;
    }

    /* SKILLS */

    .skills {
      background: white;
    }

    .skill-group {
      margin-top: 35px;
    }

    .skill-group h3 {
      margin-bottom: 15px;
    }

    .skill-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .skill {
      padding: 8px 14px;
      border-radius: 20px;
      background: #f4f7f6;
      border: 1px solid #dce3e2;
      color: #34434a;
      font-size: 0.9rem;
    }

    .skill.learning {
      background: #eaf8f7;
      border-color: #bfe5e2;
      color: #147d78;
    }

    /* PROJECTS */

    .projects {
      background: #101a21;
      color: white;
    }

    .projects .section-label {
      color: #61d1cb;
    }

    .projects .section-text {
      color: #aebbc1;
    }

    .project-card {
      margin-top: 35px;
      max-width: 800px;
      padding: 30px;
      background: #17242d;
      border: 1px solid #2b3a44;
      border-radius: 10px;
    }

    .project-status {
      display: inline-block;
      padding: 5px 10px;
      background: #203b3d;
      color: #67d4cf;
      border-radius: 20px;
      font-size: 0.8rem;
      margin-bottom: 15px;
    }

    .project-card h3 {
      margin-bottom: 10px;
      font-size: 1.4rem;
    }

    .project-card p {
      color: #aebbc1;
    }

    /* JOURNEY */

    .journey {
      background: white;
    }

    .timeline {
      margin-top: 35px;
      max-width: 750px;
      border-left: 2px solid #dce3e2;
      padding-left: 25px;
    }

    .timeline-item {
      margin-bottom: 35px;
    }

    .year {
      color: #147d78;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .timeline-item h3 {
      margin: 5px 0;
    }

    .timeline-item p {
      color: #68757c;
    }

    /* DIRECTION */

    .direction {
      background: #f4f7f6;
    }

    .direction-grid {
      margin-top: 35px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .direction-card {
      background: white;
      padding: 28px;
      border: 1px solid #dce3e2;
      border-radius: 10px;
    }

    .direction-card h3 {
      margin-bottom: 10px;
    }

    .direction-card p {
      color: #68757c;
      font-size: 0.94rem;
    }

    /* CONTACT */

    .contact {
      background: #101a21;
      color: white;
    }

    .contact .section-label {
      color: #61d1cb;
    }

    .contact .section-text {
      color: #aebbc1;
    }

    footer {
      background: #0b1218
