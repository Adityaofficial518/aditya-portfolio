<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Aditya — Computer Applications student, AI automation enthusiast, and aspiring technology builder."
  >

  <meta name="theme-color" content="#070a0f">

  <title>Aditya — AI Automation Enthusiast</title>

  <style>
    /* =========================================================
       DESIGN SYSTEM
    ========================================================= */

    :root {
      --bg: #070a0f;
      --bg-deep: #040609;
      --panel: rgba(255, 255, 255, 0.055);
      --panel-strong: rgba(255, 255, 255, 0.085);
      --text: #f4f8fa;
      --soft: #c4d0d6;
      --muted: #83919b;
      --faint: #52616b;
      --teal: #43e6d4;
      --cyan: #6edfff;
      --violet: #9585ff;
      --amber: #ffc178;
      --danger: #ff7f91;
      --line: rgba(255, 255, 255, 0.105);
      --max-width: 1180px;
      --header-height: 74px;
      --radius: 20px;
    }

    /* =========================================================
       RESET
    ========================================================= */

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(
          circle at 10% 0%,
          rgba(67, 230, 212, 0.11),
          transparent 28rem
        ),
        radial-gradient(
          circle at 100% 20%,
          rgba(149, 133, 255, 0.1),
          transparent 32rem
        ),
        var(--bg);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      line-height: 1.65;
    }

    body.menu-open {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      color: inherit;
      font: inherit;
    }

    img,
    svg {
      max-width: 100%;
    }

    ::selection {
      color: #04100e;
      background: var(--teal);
    }

    :focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 4px;
    }

    /* =========================================================
       BACKGROUND
    ========================================================= */

    .background {
      position: fixed;
      inset: 0;
      z-index: -10;
      overflow: hidden;
      pointer-events: none;
      background:
        linear-gradient(
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.025) 1px,
          transparent 1px
        );
      background-size: 58px 58px;
      -webkit-mask-image: linear-gradient(
        to bottom,
        black,
        rgba(0, 0, 0, 0.85) 55%,
        transparent 100%
      );
      mask-image: linear-gradient(
        to bottom,
        black,
        rgba(0, 0, 0, 0.85) 55%,
        transparent 100%
      );
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.2;
      mix-blend-mode: screen;
    }

    .orb-one {
      top: 8%;
      left: -180px;
      width: 360px;
      height: 360px;
      background: var(--teal);
      animation: float-one 16s ease-in-out infinite;
    }

    .orb-two {
      top: 32%;
      right: -190px;
      width: 430px;
      height: 430px;
      background: var(--violet);
      animation: float-two 20s ease-in-out infinite;
    }

    .orb-three {
      bottom: 5%;
      left: 35%;
      width: 300px;
      height: 300px;
      opacity: 0.13;
      background: var(--cyan);
      animation: float-three 18s ease-in-out infinite;
    }

    .spotlight {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -3;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      opacity: 0.15;
      pointer-events: none;
      background: radial-gradient(
        circle,
        rgba(67, 230, 212, 0.24),
        rgba(67, 230, 212, 0.06) 25%,
        transparent 68%
      );
      transform: translate(-50%, -50%);
      transition:
        opacity 0.4s ease,
        transform 0.12s linear;
    }

    .particles {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 12px var(--teal);
      animation: particle-rise linear infinite;
    }

    .particle:nth-child(1) {
      left: 8%;
      bottom: -10px;
      animation-duration: 12s;
      animation-delay: -3s;
    }

    .particle:nth-child(2) {
      left: 18%;
      bottom: -10px;
      animation-duration: 18s;
      animation-delay: -9s;
    }

    .particle:nth-child(3) {
      left: 31%;
      bottom: -10px;
      animation-duration: 15s;
      animation-delay: -6s;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
    }

    .particle:nth-child(4) {
      left: 46%;
      bottom: -10px;
      animation-duration: 20s;
      animation-delay: -13s;
    }

    .particle:nth-child(5) {
      left: 62%;
      bottom: -10px;
      animation-duration: 13s;
      animation-delay: -7s;
      background: var(--violet);
      box-shadow: 0 0 12px var(--violet);
    }

    .particle:nth-child(6) {
      left: 74%;
      bottom: -10px;
      animation-duration: 17s;
      animation-delay: -4s;
    }

    .particle:nth-child(7) {
      left: 86%;
      bottom: -10px;
      animation-duration: 14s;
      animation-delay: -11s;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
    }

    .particle:nth-child(8) {
      left: 95%;
      bottom: -10px;
      animation-duration: 21s;
      animation-delay: -15s;
    }

    @keyframes float-one {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(140px, 90px) scale(1.12);
      }
    }

    @keyframes float-two {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(-120px, 90px) scale(0.9);
      }
    }

    @keyframes float-three {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(100px, -70px);
      }
    }

    @keyframes particle-rise {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.5);
      }

      15% {
        opacity: 0.8;
      }

      85% {
        opacity: 0.4;
      }

      100% {
        opacity: 0;
        transform: translateY(-105vh) scale(1.4);
      }
    }

    /* =========================================================
       LAYOUT
    ========================================================= */

    .container {
      width: min(90%, var(--max-width));
      margin-inline: auto;
    }

    main,
    header,
    footer {
      position: relative;
      z-index: 1;
    }

    section {
      padding: 115px 0;
      scroll-margin-top: 90px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      color: var(--teal);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 30px;
      height: 1px;
      background: currentColor;
      box-shadow: 0 0 12px currentColor;
    }

    .section-title {
      max-width: 800px;
      margin-bottom: 22px;
      font-size: clamp(2.5rem, 6vw, 5rem);
      line-height: 0.98;
      letter-spacing: -0.06em;
    }

    .section-description {
      max-width: 710px;
      color: var(--muted);
      font-size: 1.07rem;
    }

    .gradient-text {
      color: transparent;
      background: linear-gradient(
        110deg,
        var(--text),
        var(--teal) 52%,
        var(--cyan)
      );
      background-clip: text;
      -webkit-background-clip: text;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      background: rgba(7, 10, 15, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .nav {
      min-height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      font-size: 1.35rem;
      font-weight: 850;
      letter-spacing: -0.05em;
    }

    .brand-mark {
      color: var(--teal);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 27px;
      list-style: none;
    }

    .nav-links a {
      position: relative;
      color: var(--muted);
      font-size: 0.84rem;
      transition: color 0.25s ease;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -8px;
      left: 0;
      height: 1px;
      background: var(--teal);
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.25s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--text);
    }

    .nav-links a:hover::after,
    .nav-links a.active::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .menu-button {
      display: none;
      width: 42px;
      height: 42px;
      cursor: pointer;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
    }

    .menu-button span,
    .menu-button::before,
    .menu-button::after {
      display: block;
      width: 18px;
      height: 2px;
      margin: 4px auto;
      border-radius: 99px;
      background: var(--text);
      content: "";
      transition: transform 0.25s ease;
    }

    .menu-button.open span {
      opacity: 0;
    }

    .menu-button.open::before {
      transform: translateY(6px) rotate(45deg);
    }

    .menu-button.open::after {
      transform: translateY(-6px) rotate(-45deg);
    }

    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding-top: 145px;
    }

    .hero-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(290px, 0.75fr);
      align-items: center;
      gap: 70px;
    }

    .availability {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 29px;
      padding: 8px 13px;
      border: 1px solid rgba(67, 230, 212, 0.2);
      border-radius: 999px;
      color: var(--soft);
      background: rgba(67, 230, 212, 0.045);
      font-size: 0.77rem;
    }

    .availability-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 16px rgba(67, 230, 212, 0.85);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.65;
      }

      50% {
        transform: scale(1.45);
        opacity: 1;
      }
    }

    .hero-title {
      max-width: 900px;
      margin-bottom: 28px;
      font-size: clamp(4.7rem, 12vw, 10.5rem);
      font-weight: 900;
      line-height: 0.82;
      letter-spacing: -0.095em;
    }

    .hero-role {
      max-width: 800px;
      margin-bottom: 20px;
      color: var(--soft);
      font-size: clamp(1.4rem, 3vw, 2.2rem);
      line-height: 1.2;
      letter-spacing: -0.04em;
    }

    .hero-role strong {
      color: var(--text);
    }

    .hero-copy {
      max-width: 700px;
      color: var(--muted);
      font-size: 1.06rem;
    }

    .hero-points {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      margin-top: 24px;
      list-style: none;
    }

    .hero-points li {
      color: var(--soft);
      font-size: 0.9rem;
    }

    .hero-points li::before {
      content: "▹";
      margin-right: 7px;
      color: var(--teal);
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 34px;
    }

    .button {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 19px;
      border: 1px solid transparent;
      border-radius: 11px;
      font-size: 0.86rem;
      font-weight: 800;
      transition:
        transform 0.25s ease,
        background 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    }

    .button:hover {
      transform: translateY(-4px);
    }

    .button-primary {
      color: #06100f;
      background: var(--teal);
      box-shadow: 0 14px 35px rgba(67, 230, 212, 0.14);
    }

    .button-primary:hover {
      background: var(--cyan);
      box-shadow: 0 14px 38px rgba(110, 223, 255, 0.18);
    }

    .button-secondary {
      border-color: var(--line);
      color: var(--text);
      background: rgba(255, 255, 255, 0.035);
    }

    .button-secondary:hover {
      border-color: rgba(67, 230, 212, 0.4);
      background: rgba(67, 230, 212, 0.07);
    }

    .hero-note {
      margin-top: 65px;
      color: var(--faint);
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* =========================================================
       TERMINAL CARD
    ========================================================= */

    .terminal {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.09),
          rgba(255, 255, 255, 0.025)
        );
      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.3),
        inset 0 1px rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transform: perspective(1000px) rotateY(-4deg) rotateX(2deg);
      transition: transform 0.5s ease;
    }

    .terminal:hover {
      transform: perspective(1000px) rotateY(0deg) rotateX(0deg) translateY(-6px);
    }

    .terminal::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.22;
      background: linear-gradient(
        120deg,
        transparent 20%,
        rgba(67, 230, 212, 0.17),
        transparent 65%
      );
      transform: translateX(-100%);
      animation: terminal-shine 6s ease-in-out infinite;
    }

    @keyframes terminal-shine {
      0%, 45% {
        transform: translateX(-100%);
      }

      70%, 100% {
        transform: translateX(100%);
      }
    }

    .terminal-bar {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 15px 17px;
      border-bottom: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.16);
    }

    .terminal-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .terminal-dot.red {
      background: #ff6e7d;
    }

    .terminal-dot.yellow {
      background: #ffc96b;
    }

    .terminal-dot.green {
      background: #52e6a8;
    }

    .terminal-title {
      margin-left: auto;
      color: var(--faint);
      font-family: monospace;
      font-size: 0.7rem;
    }

    .terminal-body {
      position: relative;
      z-index: 1;
      min-height: 290px;
      padding: 27px 23px;
      color: var(--soft);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 0.8rem;
      line-height: 2;
    }

    .code-line {
      display: block;
      min-height: 1.8em;
    }

    .code-prompt {
      color: var(--teal);
    }

    .code-command {
      color: var(--text);
    }

    .code-comment {
      color: var(--faint);
    }

    .code-key {
      color: var(--violet);
    }

    .code-string {
      color: var(--amber);
    }

    .cursor {
      display: inline-block;
      width: 7px;
      height: 1.1em;
      margin-left: 4px;
      vertical-align: -2px;
      background: var(--teal);
      animation: blink 1s steps(2) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    /* =========================================================
       CARDS AND CONTENT
    ========================================================= */

    .glass-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 20px;
      margin-top: 48px;
    }

    .glass-card {
      position: relative;
      overflow: hidden;
      padding: 31px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.065),
          rgba(255, 255, 255, 0.025)
        );
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      transition:
        transform 0.3s ease,
        border-color 0.3s ease,
        background 0.3s ease;
    }

    .glass-card::after {
      content: "";
      position: absolute;
      right: -80px;
      bottom: -85px;
      width: 175px;
      height: 175px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(67, 230, 212, 0.16),
        transparent 70%
      );
      pointer-events: none;
    }

    .glass-card:hover {
      transform: translateY(-6px);
      border-color: rgba(67, 230, 212, 0.28);
      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.09),
          rgba(255, 255, 255, 0.035)
        );
    }

    .card-icon {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      margin-bottom: 21px;
      border: 1px solid rgba(67, 230, 212, 0.25);
      border-radius: 13px;
      color: var(--teal);
      background: rgba(67, 230, 212, 0.07);
      font-size: 1.1rem;
    }

    .glass-card h3 {
      margin-bottom: 11px;
      font-size: 1.22rem;
    }

    .glass-card p {
      color: var(--muted);
      font-size: 0.96rem;
    }

    .education-card {
      max-width: 900px;
      margin-top: 45px;
    }

    .education-top {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 12px;
    }

    .education-label {
      color: var(--teal);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .education-date {
      color: var(--amber);
      font-size: 0.8rem;
    }

    .education-card h3 {
      margin-bottom: 9px;
      font-size: 1.45rem;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 11px;
      margin-top: 38px;
    }

    .skill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 13px;
      border: 1px solid rgba(67, 230, 212, 0.18);
      border-radius: 999px;
      color: var(--soft);
      background: rgba(67, 230, 212, 0.045);
      font-size: 0.84rem;
      transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        background 0.25s ease;
    }

    .skill::before {
      content: "◆";
      co
