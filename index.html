<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Aditya — Undergraduate in Computer Applications and AI Automation Enthusiast. Learning, building, and exploring practical technology solutions."
  >

  <title>Aditya — AI Automation Enthusiast</title>

  <style>

    /* ==============================
       DESIGN SYSTEM
    ============================== */

    :root {
      --bg: #07090d;
      --bg-2: #0b1016;
      --panel: rgba(255,255,255,0.055);
      --panel-hover: rgba(255,255,255,0.085);

      --text: #f5f7f8;
      --text-soft: #c6d0d6;
      --muted: #8c99a3;

      --teal: #42e6d4;
      --cyan: #70e7ff;
      --violet: #8f82ff;
      --amber: #ffbf78;

      --line: rgba(255,255,255,0.10);

      --max-width: 1180px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 12% 8%,
          rgba(66,230,212,0.09),
          transparent 28%
        ),
        radial-gradient(
          circle at 88% 22%,
          rgba(143,130,255,0.09),
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 80%,
          rgba(112,231,255,0.045),
          transparent 35%
        ),
        var(--bg);

      line-height: 1.65;

      overflow-x: hidden;
    }

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(255,255,255,0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.025) 1px,
          transparent 1px
        );

      background-size: 55px 55px;

      mask-image:
        linear-gradient(
          to bottom,
          black 0%,
          rgba(0,0,0,0.7) 45%,
          transparent 100%
        );

      pointer-events: none;

      z-index: -10;
    }

    /* ==============================
       AMBIENT BACKGROUND
    ============================== */

    .ambient {
      position: fixed;
      inset: 0;

      overflow: hidden;

      pointer-events: none;

      z-index: -5;
    }

    .orb {
      position: absolute;

      border-radius: 50%;

      filter: blur(70px);

      opacity: 0.28;

      mix-blend-mode: screen;
    }

    .orb-one {
      width: 320px;
      height: 320px;

      background: var(--teal);

      top: 10%;
      left: -140px;

      animation:
        driftOne 14s ease-in-out infinite;
    }

    .orb-two {
      width: 380px;
      height: 380px;

      background: var(--violet);

      top: 30%;
      right: -170px;

      animation:
        driftTwo 18s ease-in-out infinite;
    }

    .orb-three {
      width: 260px;
      height: 260px;

      background: var(--cyan);

      bottom: 4%;
      left: 35%;

      opacity: 0.13;

      animation:
        driftThree 16s ease-in-out infinite;
    }

    @keyframes driftOne {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(120px, 70px) scale(1.12);
      }
    }

    @keyframes driftTwo {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(-100px, 80px) scale(0.9);
      }
    }

    @keyframes driftThree {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(80px, -50px);
      }
    }

    /* ==============================
       GENERAL
    ============================== */

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(90%, var(--max-width));

      margin: 0 auto;
    }

    section {
      padding: 120px 0;
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 10px;

      margin-bottom: 16px;

      color: var(--teal);

      font-size: 0.72rem;
      font-weight: 800;

      letter-spacing: 0.16em;

      text-transform: uppercase;
    }

    .section-label::before {
      content: "";

      width: 28px;
      height: 1px;

      background: var(--teal);
    }

    .section-title {
      max-width: 800px;

      font-size: clamp(2.5rem, 6vw, 4.8rem);

      line-height: 1;

      letter-spacing: -0.055em;

      margin-bottom: 22px;
    }

    .section-description {
      max-width: 720px;

      color: var(--muted);

      font-size: 1.08rem;
    }

    /* ==============================
       NAVIGATION
    ============================== */

    header {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;

      z-index: 100;

      border-bottom:
        1px solid rgba(255,255,255,0.07);

      background:
        rgba(7,9,13,0.70);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    nav {
      min-height: 76px;

      display: flex;

      align-items: center;

      justify-content: space-between;
    }

    .brand {
      font-size: 1.35rem;

      font-weight: 850;

      letter-spacing: -0.04em;
    }

    .brand span {
      color: var(--teal);
    }

    .nav-links {
      display: flex;

      gap: 28px;

      list-style: none;
    }

    .nav-links a {
      color: var(--muted);

      font-size: 0.86rem;

      transition: color .25s ease;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    /* ==============================
       HERO
    ============================== */

    .hero {
      min-height: 100vh;

      display: flex;

      align-items: center;

      padding-top: 100px;

      position: relative;
    }

    .hero-content {
      max-width: 1000px;
    }

    .status {
      display: inline-flex;

      align-items: center;

      gap: 9px;

      padding: 8px 13px;

      border:
        1px solid rgba(66,230,212,0.20);

      border-radius: 999px;

      background:
        rgba(66,230,212,0.045);

      color: var(--text-soft);

      font-size: 0.77rem;

      margin-bottom: 30px;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--teal);

      box-shadow:
        0 0 16px rgba(66,230,212,0.8);
    }

    .hero-name {
      font-size: clamp(5.5rem, 16vw, 12rem);

      line-height: 0.78;

      letter-spacing: -0.085em;

      font-weight: 850;

      margin-bottom: 38px;

      color: var(--text);
    }

    .hero-name span {
      background:
        linear-gradient(
          105deg,
          var(--text) 10%,
          var(--teal) 50%,
          var(--cyan) 90%
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .hero-role {
      max-width: 900px;

      font-size: clamp(1.45rem, 3vw, 2.25rem);

      line-height: 1.25;

      letter-spacing: -0.035em;

      color: var(--text-soft);

      margin-bottom: 20px;
    }

    .hero-role strong {
      color: var(--text);
    }

    .hero-copy {
      max-width: 750px;

      color: var(--muted);

      font-size: 1.08rem;
    }

    .hero-points {
      display: flex;

      flex-wrap: wrap;

      gap: 10px 22px;

      margin-top: 25px;

      list-style: none;
    }

    .hero-points li {
      color: var(--text-soft);

      font-size: 0.92rem;
    }

    .hero-points li::before {
      content: "•";

      color: var(--teal);

      margin-right: 8px;
    }

    .actions {
      display: flex;

      flex-wrap: wrap;

      gap: 12px;

      margin-top: 34px;
    }

    .button {
      min-height: 48px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      padding: 0 19px;

      border-radius: 10px;

      border:
        1px solid transparent;

      font-size: 0.88rem;

      font-weight: 750;

      transition:
        transform .25s ease,
        background .25s ease,
        border-color .25s ease;
    }

    .button:hover {
      transform: translateY(-3px);
    }

    .button-primary {
      background: var(--teal);

      color: #06100f;

      box-shadow:
        0 12px 35px rgba(66,230,212,0.12);
    }

    .button-primary:hover {
      background: var(--cyan);
    }

    .button-secondary {
      background:
        rgba(255,255,255,0.035);

      border-color: var(--line);

      color: var(--text);
    }

    .button-secondary:hover {
      border-color:
        rgba(66,230,212,0.35);

      background:
        rgba(66,230,212,0.05);
    }

    .hero-note {
      margin-top: 75px;

      color: #65727b;

      font-size: 0.72rem;

      letter-spacing: 0.14em;

      text-transform: uppercase;
    }

    /* ==============================
       CARDS
    ============================== */

    .grid-two {
      display: grid;

      grid-template-columns:
        1.15fr
        0.85fr;

      gap: 20px;

      margin-top: 50px;
    }

    .glass {
      position: relative;

      padding: 32px;

      border:
        1px solid var(--line);

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.065),
          rgba(255,255,255,0.025)
        );

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      overflow: hidden;

      transition:
        transform .3s ease,
        border-color .3s ease,
        background .3s ease;
    }

    .glass::after {
      content: "";

      position: absolute;

      width: 150px;
      height: 150px;

      right: -80px;
      bottom: -80px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(66,230,212,0.16),
          transparent 70%
        );

      pointer-events: none;
    }

    .glass:hover {
      transform: translateY(-5px);

      border-color:
        rgba(66,230,212,0.25);

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.085),
          rgba(255,255,255,0.035)
        );
    }

    .glass h3 {
      font-size: 1.25rem;

      margin-bottom: 12px;
    }

    .glass p {
      color: var(--muted);

      font-size: 0.98rem;
    }

    /* ==============================
       EDUCATION
    ============================== */

    .education {
      margin-top: 48px;

      max-width: 900px;
    }

    .education-top {
      display: flex;

      justify-content: space-between;

      gap: 20px;
    }

    .education-label {
      color: var(--teal);

      font-size: 0.72rem;

      font-weight: 800;
